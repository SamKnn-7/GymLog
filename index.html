<!doctype html>
<html lang="en" data-theme="light" data-motion="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GymLog">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>GymLog</title>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Put the saved theme in place before the first paint, so a dark app never
    // flashes white and the phone's status bar has the app's colour from the start.
    try {
      var saved = JSON.parse(localStorage.getItem('gymlog.v2') || '{}');
      if (saved.settings && saved.settings.theme === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.querySelector('meta[name="theme-color"]').content = '#0e1014';
        // iPhones: draw the app behind the status bar instead of putting a white bar there
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = 'black-translucent';
      }
    } catch (e) { /* the app sets the theme again once it has loaded */ }
  </script>
</head>
<body>
  <div id="shell">
    <aside id="sidebar">
      <div class="brand"><span class="brand-mark">G</span>GymLog</div>
      <nav id="sidenav" aria-label="Main"></nav>
      <div class="sidebar-foot">
        <button id="theme-toggle" class="nav-item" data-action="toggle-theme"></button>
        <p class="muted small">Your data stays on this device.</p>
      </div>
    </aside>
    <div id="main">
      <header id="topbar"></header>
      <main id="app"></main>
    </div>
  </div>
  <nav id="tabbar" aria-label="Main"></nav>

  <div id="timer-pill" hidden></div>
  <div id="modal"></div>
  <div id="confetti" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="tip" role="tooltip" hidden></div>

  <script src="js/util.js"></script>
  <script src="js/library.js"></script>
  <script src="js/store.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/core.js"></script>
  <script src="js/bodymap.js"></script>
  <script src="js/install.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/workout.js"></script>
  <script src="js/views/history.js"></script>
  <script src="js/views/exercises.js"></script>
  <script src="js/views/body.js"></script>
  <script src="js/views/tools.js"></script>
  <script src="js/views/custom.js"></script>
  <script src="js/views/setup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
